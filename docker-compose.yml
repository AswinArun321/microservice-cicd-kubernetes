version: '3.8'

services:
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      - SERVICE_NAME=auth-service
      - PORT=5001
      - JWT_SECRET=microservice-super-secret-key-321
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - microservice-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-service
    ports:
      - "5002:5002"
    environment:
      - SERVICE_NAME=api-service
      - PORT=5002
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - microservice-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-service
    ports:
      - "5003:5003"
    environment:
      - SERVICE_NAME=worker-service
      - PORT=5003
      - WORKER_INTERVAL=5.0
      - AUTO_START_WORKER=true
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge
