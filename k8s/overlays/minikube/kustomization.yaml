apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microservices

resources:
  - ../../base

# In Minikube, we use the local or GHCR image repository tags
images:
  - name: ghcr.io/aswinarun321/auth-service
    newName: ghcr.io/aswinarun321/auth-service
    newTag: latest
  - name: ghcr.io/aswinarun321/api-service
    newName: ghcr.io/aswinarun321/api-service
    newTag: latest
  - name: ghcr.io/aswinarun321/worker-service
    newName: ghcr.io/aswinarun321/worker-service
    newTag: latest
